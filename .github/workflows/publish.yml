name: publish

# Manual, human-gated publish to nuget.org via Trusted Publishing (OIDC).
# Before dispatching: bump the repo-root VERSION file and merge it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify VERSION is tagged and released
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-publish-version.sh
      - name: Pack
        run: dotnet pack src/AiSheepdog/AiSheepdog.csproj -c Release -o artifacts --nologo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: Arasz
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          find artifacts -type f -name '*.nupkg' -print0 \
            | xargs -0 -r -n1 dotnet nuget push --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
